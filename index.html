<style>
:root{
  --navy:#0f1b2d;--navy-2:#18283f;--navy-ink:#e8eef7;--navy-sub:#9fb0c8;
  --bg:#eef1f5;--surface:#fff;--ink:#0f1b2d;--sub:#56657a;--line:#dde3eb;--soft:#f4f6f9;
  --amber:#f5a524;--amber-ink:#5c3b00;--amber-soft:#fff4dc;
  --ok:#0e9f6e;--bad:#d92d20;--bad-soft:#fdeceb;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0a1220;--surface:#121d30;--ink:#e8eef7;--sub:#9fb0c8;--line:#24334b;--soft:#17243a;
  --amber-soft:#3a2c10;--amber-ink:#ffd58a;--bad-soft:#3a1916;--navy-2:#1a2b45}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
  font-feature-settings:"tnum";padding-bottom:calc(72px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
::selection{background:var(--amber);color:#000}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
a{color:inherit;text-decoration:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 머리 */
header{position:sticky;top:0;z-index:5;background:var(--navy);color:var(--navy-ink);padding:calc(10px + env(safe-area-inset-top)) 16px 12px}
.hd{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.hd .t{flex:1;min-width:0}
.hd small{display:block;font-size:12px;color:var(--navy-sub);letter-spacing:.02em}
.hd h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--navy-sub);background:var(--navy-2);border-radius:99px;padding:5px 10px;white-space:nowrap}
.pill[hidden]{display:none}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
#back{display:none;background:none;border:0;color:inherit;width:36px;height:36px;margin-left:-8px;padding:0;place-items:center}

main{padding:14px 16px 8px;max-width:640px;margin:0 auto}
section{margin-bottom:22px}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 8px}
.sh h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.sh a,.sh span{font-size:13px;color:var(--sub)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);min-height:52px}
.row:first-child{border-top:0}
.row .m{flex:1;min-width:0}
.row .r{text-align:right;white-space:nowrap}
.row b{font-weight:600}
.sub{color:var(--sub);font-size:13px}
.empty{padding:16px 14px;color:var(--sub);font-size:14px}
.chev{color:var(--sub);width:16px;height:16px}

/* 오늘 생산 판 */
.today{background:var(--navy);color:var(--navy-ink);border-radius:18px;padding:16px 16px 6px;margin-bottom:12px;box-shadow:0 10px 24px -14px rgba(15,27,45,.55)}
.today .lab{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--navy-sub);margin-bottom:6px}
.today .lab b{color:var(--amber);font-weight:700;font-size:14px}
.prod{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid rgba(255,255,255,.08)}
.prod:first-of-type{border-top:0}
.prod .n{flex:1;font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.prod .q{font-size:20px;font-weight:800;color:var(--amber)}
.prod .q small{font-size:13px;font-weight:600;color:var(--navy-sub);margin-left:2px}
.prod .chev{color:var(--navy-sub)}
.tmr{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0 12px;border-top:1px solid rgba(255,255,255,.12);font-size:14px;color:var(--navy-sub)}
.tmr span{background:var(--navy-2);color:var(--navy-ink);border-radius:8px;padding:4px 9px}

/* 바로가기 */
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:22px}
.quick a{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600}
.quick a svg{color:var(--navy)}
@media (prefers-color-scheme:dark){.quick a svg{color:var(--amber)}}
.quick a em{font-style:normal;font-size:11px;font-weight:500;color:var(--sub)}

/* 자료 기준 시각 · 경고 */
.warn{display:flex;gap:10px;align-items:flex-start;background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;font-weight:600}
.warn div{display:grid;gap:2px}.warn small{font-weight:500;color:var(--ink);font-size:13px}
.fresh{display:flex;flex-wrap:wrap;gap:4px 12px;margin:-10px 2px 22px;font-size:12px;color:var(--sub)}
.fresh span.bad{color:var(--bad);font-weight:700}
.fresh i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:4px;vertical-align:1px}
.fresh .bad i{background:var(--bad)}
.box.alert{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.short-q{color:var(--bad);font-weight:700}
details.more>summary{font-size:14px;color:var(--sub);font-weight:600}

.notice{display:flex;gap:10px;background:var(--amber-soft);color:var(--amber-ink);border-radius:12px;padding:12px 14px;margin-bottom:22px;font-size:14px}
.notice div{display:grid;gap:2px}

.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--sub);margin-right:6px;vertical-align:2px}
.tag.today{background:var(--amber);color:#000}.tag.in{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.io-in{color:var(--ok)}.io-out{color:var(--bad)}.tag.past{background:var(--bad-soft);color:var(--bad)}
.ic-bell,.ic-cal,.ic-prod{width:16px;height:16px;vertical-align:-3px;margin-right:5px}
.ic-bell{color:var(--amber)}.ic-cal{color:#2f6fde}.ic-prod{color:var(--ok)}

/* 날짜 띠 */
.strip{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 16px;padding:0 16px 2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip a{flex:none;width:52px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center;padding:7px 0 8px}
.strip a small{display:block;font-size:11px;color:var(--sub)}
.strip a b{font-size:18px}
.strip a i{display:block;margin:3px auto 0;width:5px;height:5px;border-radius:50%;background:var(--line)}
.strip a.has i{background:var(--amber)}
.strip a.on{background:var(--navy);border-color:var(--navy);color:#fff}.strip a.on small{color:var(--navy-sub)}
.day{scroll-margin-top:84px}

/* 검색·칩 */
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--sub)}
.search input{width:100%;font:inherit;font-size:16px;padding:12px 12px 12px 42px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.search input::placeholder{color:var(--sub)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.chip{flex:none;font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 14px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* 배합 계산 */
.rhead{margin:4px 2px 14px}
.rhead h2{margin:0;font-size:24px;letter-spacing:-.03em;line-height:1.25}
.step{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;margin-bottom:12px}
.step button{width:52px;height:52px;border-radius:12px;border:0;background:var(--soft);color:var(--ink);display:grid;place-items:center}
.step button:active{background:var(--line)}
.step label{flex:1;text-align:center}
.step input{width:100%;border:0;background:none;color:var(--ink);font:inherit;font-size:30px;font-weight:800;text-align:center;padding:0}
.step label small{display:block;font-size:12px;color:var(--sub);margin-top:-2px}
/* 라벨 출력 */
.ldate{display:block;width:100%;font:inherit;font-size:20px;font-weight:700;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);margin-bottom:12px}
.lgo{width:100%;font:inherit;font-size:18px;font-weight:800;padding:16px;border:0;border-radius:14px;background:var(--navy);color:#fff;margin-top:4px}
.lgo:disabled{opacity:.5}
.lprev img{display:block;width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px}
.lmsg{margin:12px 2px;font-size:15px;line-height:1.5}.lmsg.bad{color:var(--bad)}.lmsg.good{color:var(--good,#1f9d6b);font-weight:700}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 10px;font-size:14px;color:var(--sub)}
.sum b{font-size:20px;color:var(--ink)}
.need{font-size:18px;font-weight:700}
.need small{font-size:13px;color:var(--sub);font-weight:500;margin-left:2px}
.bar{height:4px;border-radius:2px;background:var(--soft);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:2px}
.bar.short i{background:var(--bad)}
.st{font-size:12px;color:var(--sub);margin-top:3px}
.note{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;font-size:12px;font-weight:600;color:var(--amber-ink);background:var(--amber-soft);vertical-align:1px}
.st.short{color:var(--bad);font-weight:700}

details>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 14px;border-top:1px solid var(--line);font-weight:600;min-height:50px}
details:first-of-type>summary{border-top:0}
details>summary::-webkit-details-marker{display:none}
details>summary .chev{margin-left:auto;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
details[open]>summary .chev{transform:rotate(90deg)}
details .row{padding-left:22px;background:var(--soft)}
.qty{font-weight:700}.qty.zero{color:var(--bad)}

/* 아래 메뉴 */
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:saturate(1.4) blur(12px);
  border-top:1px solid var(--line);display:flex;padding:4px 4px env(safe-area-inset-bottom)}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 8px;font-size:11px;font-weight:600;color:var(--sub);position:relative}
nav a.on{color:var(--ink)}
nav a.on::before{content:"";position:absolute;top:0;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--amber)}

/* 잠금 */
#lock{max-width:340px;margin:14vh auto 0;text-align:center}
#lock .lk{width:56px;height:56px;border-radius:16px;background:var(--navy);color:var(--amber);display:grid;place-items:center;margin:0 auto 14px}
#lock .lk svg{width:26px;height:26px}
#lock h2{margin:0 0 4px;font-size:21px;letter-spacing:-.02em}
#lock p{margin:0 0 18px;color:var(--sub);font-size:14px}
#lock p.err{color:var(--bad);font-weight:600}
#lock input[type=password]{width:100%;font:inherit;font-size:18px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-align:center}
#lock label{display:flex;justify-content:center;align-items:center;gap:6px;margin:12px 0;color:var(--sub);font-size:14px}
#lock button{width:100%;font:inherit;font-size:17px;font-weight:700;padding:14px;border:0;border-radius:12px;background:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){#lock button{background:var(--amber);color:#000}}

.fade{animation:in .28s cubic-bezier(.16,1,.3,1)}
@keyframes in{from{opacity:.4;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></symbol>
  <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7.5 15h9"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></symbol>
  <symbol id="i-truck" viewBox="0 0 24 24"><path d="M2 6h12v10H2zM14 9.5h4l4 3.5v3h-8"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-mega" viewBox="0 0 24 24"><path d="M3 10v4h3l7 4V6L6 10z"/><path d="M17 9a4 4 0 0 1 0 6"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></symbol>
  <symbol id="i-factory" viewBox="0 0 24 24"><path d="M3 21V10l5 3V10l5 3V10l5 3V4h3v17z"/><path d="M7 17h2M12 17h2"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</svg>
<header><div class="hd">
  <button id="back" onclick="goBack()" aria-label="뒤로"><svg class="i"><use href="#i-left"/></svg></button>
  <div class="t"><small id="kick">대경식품 청주공장</small><h1 id="ttl"></h1></div>
  <span class="pill" id="upd" hidden><i></i><span></span></span>
</div></header>
<main id="view"></main>
<nav>
  <a href="#home"><svg class="i"><use href="#i-home"/></svg>홈</a>
  <a href="#plan"><svg class="i"><use href="#i-cal"/></svg>생산</a>
  <a href="#recipe"><svg class="i"><use href="#i-flask"/></svg>배합표</a>
  <a href="#stock"><svg class="i"><use href="#i-box"/></svg>재고</a>
  <a href="#orders"><svg class="i"><use href="#i-truck"/></svg>발주</a>
  <a href="#label"><svg class="i"><use href="#i-tag"/></svg>라벨</a>
</nav>
<script>
let P, B, W, stock, plan, openOrders;
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic = (n, c='i') => `<svg class="${c}"><use href="#i-${n}"/></svg>`;
const ymd = d => new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const TODAY = ymd(new Date()), TMR = ymd(new Date(Date.now()+864e5));
const WD = '일월화수목금토', wd = s => WD[new Date(s + 'T00:00').getDay()];
const md = s => `${+s.slice(5,7)}/${+s.slice(8,10)}(${wd(s)})`;
const n = (x, d=1) => (+x).toLocaleString('ko-KR', {maximumFractionDigits:d});
const dayTag = s => s === TODAY ? '<span class="tag today">오늘</span>' : s === TMR ? '<span class="tag">내일</span>' : s < TODAY ? '<span class="tag past">지남</span>' : '';
const recipeHref = p => p.제품 && P.레시피[p.제품] ? `#recipe/${encodeURIComponent(p.제품)}/${p.배합 || P.레시피[p.제품].기본수량 || 1}` : '';

function init() {
  P = window.PROD || {레시피:{},생산계획:[]};
  B = window.BOARD || {events:[], notice:[], plan:null}; W = (window.ECOUNT_WAREHOUSE||{warehouses:[]}).warehouses;
  // 이카운트 재고: 이름 → 수량 (원재료창고·제품창고)
  stock = {};
  for (const w of W) for (const g of w.groups) for (const it of g.items) stock[it.name] = (stock[it.name] || 0) + it.qty;
  // 생산 = TV 현황판 줄 그대로 (없으면 노트북 미리보기라 생산데이터.js)
  plan = (B.plan || P.생산계획 || []).filter(p => p.날짜 >= TODAY).sort((a,b) => a.날짜.localeCompare(b.날짜));
  // 납기 = TV 현황판 '발주접수' 칸 (문자·카톡 발주 읽은 것 말고). 날짜 없는 줄은 맨 아래
  openOrders = (B.recv || []).filter(r => !r.날짜 || r.날짜 >= TODAY).sort((a,b) => (a.날짜 || '9').localeCompare(b.날짜 || '9'));
  const u = $('#upd'); u.hidden = false; u.lastElementChild.textContent = (P.updated || '').slice(5).replace('-', '/');
  document.querySelector('nav').style.display = '';
  addEventListener('hashchange', route); route();
}

const prodName = p => esc(p.제품 || p.원문);
const prodQty = p => p.배합 ? `${n(p.배합)}<small>${P.레시피[p.제품]?.단위 === '개' ? '개' : '배합'}</small>` : '';
const planRow = p => { const h = recipeHref(p);
  return `<a class="row" ${h ? `href="${h}"` : ''}><div class="m">${ic('factory','i ic-prod')}<b>${prodName(p)}</b>${p.제품 && p.원문 !== p.제품 ? `<div class="sub">현황판: ${esc(p.원문)}</div>` : ''}</div><div class="r need">${prodQty(p)}</div>${h ? ic('right','i chev') : ''}</a>`; };
const orderRow = o => `<div class="row"><div class="m">${o.날짜 ? dayTag(o.날짜) : ''}<b>${esc(o.품목)}</b>${o.수량 ? `<div class="sub">${esc(o.수량)}</div>` : ''}</div><div class="r"><b>${o.날짜 ? md(o.날짜) : '날짜 없음'}</b></div></div>`;
const evRow = e => `<div class="row"><div class="m">${dayTag(e.날짜)}${e.종류 === '알림' ? ic('bell','i ic-bell') : ic('cal','i ic-cal')}${esc(e.제목)}</div><div class="r sub">${md(e.날짜)}</div></div>`;
// 전일 입출고 = TV 현황판과 같은 입출고데이터.js (이카운트 재고수불부, 매일 저녁 받음). 오늘 전 날 중 내역 있는 가장 최근 날 (월요일엔 토요일)
function ioPrev() {
  const past = ((window.ECOUNT_IO || {}).days || []).filter(x => x && x.date < TODAY).sort((a, b) => b.date.localeCompare(a.date));
  return past.find(x => x.rows?.length) || past[0] || null;
}
const ioLabel = r => r.kind === '판매' ? '판매출고' : r.kind === '창고이동'
  ? (/→/.test(r.partner) && !/→\s*청주/.test(r.partner) ? ((r.partner.match(/\[([^\]]+)\]\s*$/) || [, '타창고'])[1]) + '이동' : '이동입고') : r.kind === '조정' ? '재고조정' : r.kind;
const ioRow = r => `<div class="row"><div class="m"><span class="tag${r.in ? ' in' : ''}">${esc(ioLabel(r))}</span><b>${esc(r.item)}</b>${r.partner && r.kind === '판매' ? `<div class="sub">${esc(r.partner)}</div>` : ''}</div>
  <div class="r">${r.in ? `<b class="io-in">+${n(Math.abs(r.in))}</b>` : ''}${r.in && r.out ? '<br>' : ''}${r.out ? `<b class="io-out">−${n(Math.abs(r.out))}</b>` : ''}</div></div>`;
const ioHead = X => X ? `${md(X.date)} · 입고 ${X.rows.filter(r => r.in).length} · 출고 ${X.rows.filter(r => r.out).length}` : '';
// 금일 생산·출고 = 같은 입출고데이터.js 의 오늘 날짜 (저녁 18:30·19:30 에 받음). 생산입고 → 판매 → 이동 → 나머지 순
const ioDay = d => ((window.ECOUNT_IO || {}).days || []).find(x => x?.date === d) || null;
const ioRank = r => ({생산입고: 0, 판매: 1, 창고이동: 2})[r.kind] ?? 3;
const ioToday = () => (ioDay(TODAY)?.rows || []).slice().sort((a, b) => ioRank(a) - ioRank(b));
const list = (rows, none='없음') => `<div class="box">${rows.join('') || `<div class="empty">${none}</div>`}</div>`;

// 자료마다 받은 시각. 늦으면 빨간색 + 홈 맨 위 경고 (직원이 옛 숫자를 믿지 않게)
// 재고 = 매시 갱신 → 3시간 넘으면 늦음 / 입출고 = 매일 18:30·19:30 → 26시간 / 로그인유지 = 매시 → 2시간
const age = s => s ? (Date.now() - new Date(s.replace(' ', 'T'))) / 36e5 : Infinity;
const hm = s => s ? `${+s.slice(5,7)}/${+s.slice(8,10)} ${s.slice(11,16)}` : '없음';
function freshness() {
  const L = window.LOGIN, IO = window.ECOUNT_IO || {}, WHu = window.ECOUNT_WAREHOUSE?.updated;
  const items = [
    { k: '재고', t: hm(WHu), bad: age(WHu) > 3 },
    { k: '입출고', t: hm(IO.updated), bad: IO.loginNeeded || age(IO.updated) > 26 },
    { k: '일정', t: B.updated || '없음', bad: false },
    { k: '이카운트 로그인', t: L ? (L.ok ? '유지 중' : '풀림') : '모름', bad: !L || !L.ok || age(L.at) > 2 },
  ];
  const warn = [];
  if (L && !L.ok || IO.loginNeeded) warn.push('이카운트 로그인이 풀려 있어요');
  else if (items[3].bad) warn.push('이카운트 로그인 확인이 늦어요');
  for (const x of items.slice(0, 2)) if (x.bad) warn.push(`${x.k}가 늦게 받아졌어요 (${x.t} 기준)`);
  return { items, warn };
}

function bump(d) { const i = $('#bn'), st = isEa(curRecipe()) ? 500 : 1; i.value = Math.max(isEa(curRecipe()) ? 0 : 0.5, (+i.value || 0) + d * st); calc(); }

  let t;
  if (u === '일') t = new Date(y, m - 1, d + n - 1);
  else { const mm = m - 1 + (u === '년' ? n * 12 : n), Y = y + Math.floor(mm / 12), M = mm % 12; t = new Date(Y, M, Math.min(d, new Date(Y, M + 1, 0).getDate()) - 1); }
  return `${t.getFullYear()}.${String(t.getMonth() + 1).padStart(2, '0')}.${String(t.getDate()).padStart(2, '0')}`;
}
function labelDetail(i) {
  const l = (window.LABELS || [])[i];
  if (!l) return list([], '라벨을 찾을 수 없어요');
  if (!l.제조일) return `<div class="rhead"><span class="tag">${esc(l.폴더)}</span><h2>${esc(l.이름)}</h2></div><p class="lmsg bad">이 라벨은 제조일 칸이 비어 있어요. 사무실 PC 한글에서 날짜를 한 번 적어 저장하면 여기서 뽑을 수 있어요.</p>`;
  return `<div class="rhead"><span class="tag">${esc(l.폴더)}</span><h2>${esc(l.이름)}</h2></div>
    ${l.제목 ? `<label class="sub" style="display:block;margin:0 2px 4px">제목 (중량 등 고쳐서 뽑을 수 있어요 · 원본 파일은 그대로)</label>
    <input class="ldate" id="lt" value="${esc(l.제목)}" maxlength="60" autocomplete="off" oninput="labelChanged()">` : ''}
    <label class="sub" style="display:block;margin:0 2px 4px">제조일</label><input class="ldate" type="date" id="ld" value="${TODAY}" onchange="labelChanged()">
    <div id="lp"></div>
    ${l.소비기한 === '' ? `<p class="lmsg bad">소비기한 칸이 비어 있어 제조일만 바뀌어요. 사무실 PC 한글에서 소비기한 날짜를 한 번 적어 저장하면 그 다음부터 자동 계산돼요${l.기간 ? ` (오늘 제조면 ${addPeriod(TODAY, ...l.기간)})` : ''}</p>` : ''}
    <div class="lprev" id="lv"></div><button class="chip" id="lvb" onclick="labelView(${i})" hidden>바뀐 내용으로 미리보기</button>
    <p class="lmsg" id="lh">${l.최근 ? '마지막 출력<br>' + esc(l.최근) : '아직 휴대폰으로 뽑은 기록 없음'}</p>
    <div class="step"><button onclick="labelBump(-1)" aria-label="줄이기">${ic('minus')}</button>
      <label><input type="number" id="ln" value="1" min="1" max="500" inputmode="numeric" onfocus="this.select()"><small>장</small></label>
      <button onclick="labelBump(1)" aria-label="늘리기">${ic('plus')}</button></div>
    <div class="chips">${[1, 10, 20, 50, 100].map(q => `<button class="chip" onclick="$('#ln').value=${q}">${q}장</button>`).join('')}</div>
    <button class="lgo" id="lgo" onclick="sendLabel(${i})">출력</button><div id="lr"></div>`;
}
function labelBump(d) { const n = $('#ln'); n.value = Math.min(500, Math.max(1, (+n.value || 0) + d)); }
function labelChanged() {   // 날짜 줄 다시 계산 + 그려 둔 미리보기는 흐리게
  const l = LABELS[+location.hash.split('/')[1]], d = $('#ld')?.value;
  if (!l || !d) return;
  $('#lp').innerHTML = `<div class="lmsg" style="margin-top:0">라벨에 찍힐 날짜<br>제조일 <b>${d.replaceAll('-', '.')}</b>${l.소비기한 && l.기간 ? `<br>소비기한 <b>${addPeriod(d, ...l.기간)}</b>` : ''}</div>`;
  if ($('#lv img')) { $('#lv').style.opacity = .35; $('#lvb').hidden = false; }
}
function showRecent(i, arr) {
  LABELS[i].최근 = arr[0] || '';
  if ($('#lh') && location.hash === '#label/' + i) $('#lh').innerHTML = arr.length ? '최근 출력<br>' + arr.map(esc).join('<br>') : '아직 휴대폰으로 뽑은 기록 없음';
}
// 미리보기: PC가 한글로 고친 라벨을 그림으로 만들어 중계에 붙여 줌 (그림 주소는 3시간 뒤 사라짐)
let VIEWN = 0;
async function labelView(i) {
  if (!$('#lv') || !PWD) return;
  const my = ++VIEWN, put = h => { if (my === VIEWN && $('#lv')) $('#lv').innerHTML = h; };
  $('#lv').style.opacity = 1; $('#lvb').hidden = true;
  put('<p class="lmsg">PC에서 미리보기 만드는 중… (5~10초)</p>');
  const r = await labelAsk('preview', i, 0, () => put('<p class="lmsg">PC가 받았어요 · 그림 만드는 중…</p>'));
  put(r.ok && r.img ? `<img src="${esc(r.img)}" alt="라벨 미리보기">` : `<p class="lmsg bad">${esc(r.msg || '미리보기를 못 받았어요')}</p><button class="chip" onclick="labelView(${i})">미리보기 다시</button>`);
  if (r.최근) showRecent(i, r.최근);
}
async function hmacHex(key, msg) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(key), {name: 'HMAC', hash: 'SHA-256'}, false, ['sign']);
  return [...new Uint8Array(await crypto.subtle.sign('HMAC', k, new TextEncoder().encode(msg)))].map(b => b.toString(16).padStart(2, '0')).join('');
}
const pj = s => { try { return JSON.parse(s); } catch { return {}; } };
// PC에 요청 보내고 끝 대답 기다리기 (kind: print/preview). '받음' 오면 onGot(). 40초 동안 대답 없으면 PC가 꺼졌거나 도우미가 안 켜진 것
async function labelAsk(kind, i, n, onGot) {
  const l = LABELS[i], t = ($('#lt')?.value || '').trim();
  const j = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), kind, label: l.id, date: $('#ld').value, n, t: t === l.제목 ? '' : t, ts: Date.now() };
  j.sig = await hmacHex(PWD, `${j.id}|${j.label}|${j.date}|${j.n}|${j.ts}|${j.kind}|${j.t}`);
  const r = await relayAsk(j, onGot);
  return r.fin || { ok: false, msg: r.err || (!r.got ? 'PC가 대답이 없어요. 사무실 PC가 켜져 있는지 확인해 주세요' : kind === 'print' ? 'PC가 받았는데 끝났다는 대답이 없어요. 프린터를 확인해 주세요' : 'PC가 받았는데 그림이 안 왔어요') };
}
// 중계로 보내고 같은 id 대답 기다리기 → {fin, got, err}. 40초 동안 '받음'도 없으면 PC 꺼짐. tries × 2초까지 끝 대답 기다림
async function relayAsk(j, onGot, tries = 45) {
  const since = Math.floor(j.ts / 1000) - 5;
  const sent = await fetch(RELAY + LABEL_TOPIC, { method: 'POST', body: JSON.stringify(j) }).catch(() => null);
  if (!sent?.ok) return { err: '인터넷 연결을 확인해 주세요' };
  let got = false;
  for (let k = 0; k < tries; k++) {
    await new Promise(r => setTimeout(r, 2000));
    let rows = [];
    try { rows = (await (await fetch(`${RELAY}${LABEL_TOPIC}-r/json?poll=1&since=${since}`)).text()).split('\n').filter(Boolean).map(pj).map(m => ({ ...pj(m.message), img: m.attachment?.url })).filter(x => x.id === j.id); } catch {}
    const fin = rows.find(x => 'ok' in x);
    if (fin) return { fin, got: true };
    if (rows.length && !got) { got = true; onGot?.(); }
    if (!got && k >= 20) break;
  }
  return { got };
}

// ── 생산입력: 별도 PIN → PC 생산입력.py → 이카운트 생산불출·생산입고 (미리보기 → 저장 → 재고 변동으로 확인) ──
// PIN 은 PC가 확인 (현황판 비밀번호 아는 직원도 PIN 없으면 못 씀). 이 탭에서만 기억
let PPIN = '', PL = null, PBODY = '';
async function prodAsk(kind, body, onGot, tries) {
  const j = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), kind, ts: Date.now(), body: body || '' };
  j.sig = await hmacHex(PPIN, `${j.id}|${j.kind}|${j.ts}|${j.body}`);
  const r = await relayAsk(j, onGot, tries);
  return r.fin || { ok: false, msg: r.err || (r.got ? 'PC가 받았는데 끝났다는 대답이 없어요. 이카운트에서 직접 확인해 주세요' : 'PC가 대답이 없어요. 사무실 PC가 켜져 있는지 확인해 주세요') };
}
function prodInit() {
  const f = $('#ppin');
  if (f) return f.onsubmit = async e => {
    e.preventDefault();
    PPIN = $('#ppw').value.trim(); $('#ppgo').disabled = true; $('#ppgo').textContent = 'PC에 확인하는 중…'; $('#ppr').innerHTML = '';
    const r = await prodAsk('prod-hello', '', () => $('#ppgo').textContent = 'PC가 받았어요 · 목록 받는 중…');
    if (r.ok) { PL = r; return route(); }
    PPIN = ''; $('#ppgo').disabled = false; $('#ppgo').textContent = '들어가기';
    $('#ppr').innerHTML = `<p class="lmsg bad">${esc(r.msg)}</p>`;
  };
  if (!$('#pis').children.length) { prodRow('pis'); prodRow('prs'); }
}
function prodRow(box) {
  const is = box === 'pis', d = document.createElement('div');
  d.className = 'row'; d.style.gap = '8px';
  d.innerHTML = `<input class="ldate" style="flex:1;margin:0" list="${is ? 'pdl' : 'pil'}" placeholder="${is ? '제품 고르기' : '품목 (직접 입력 가능)'}" oninput="prodDirty()">
    <input class="ldate" style="width:84px;margin:0" type="number" inputmode="decimal" min="0" step="${is ? '0.5' : '1'}" placeholder="${is ? '배합' : '수량'}" oninput="prodDirty()">
    <button class="chip" style="margin:0" onclick="this.parentNode.remove();prodDirty()" aria-label="줄 빼기">✕</button>`;
  $('#' + box).appendChild(d);
}
function prodDirty() { PBODY = ''; const o = $('#pout'); if (o && o.innerHTML) o.innerHTML = '<p class="lmsg">내용이 바뀌었어요. 미리보기를 다시 받아주세요</p>'; }
const prodRows = box => [...$('#' + box).children].map(d => [...d.querySelectorAll('input')].map(i => i.value.trim())).filter(([a, b]) => a && +b > 0);
async function prodPreview() {
  const body = JSON.stringify({ date: $('#pd').value, 불출: prodRows('pis').map(([a, b]) => ({ 제품: a, 배합: +b })), 입고: prodRows('prs').map(([a, b]) => ({ 품목: a, 수량: +b })) });
  const btn = $('#pvgo'), out = $('#pout');
  btn.disabled = true; btn.textContent = 'PC로 보내는 중…'; out.innerHTML = '';
  const r = await prodAsk('prod-preview', body, () => btn.textContent = 'PC가 받았어요 · 배합표로 계산 중…');
  btn.disabled = false; btn.textContent = '미리보기';
  if (!r.ok) return out.innerHTML = `<p class="lmsg bad">${esc(r.msg)}</p>`;
  PBODY = r.저장가능 ? body : '';
  out.innerHTML = prodText(r) + (r.저장가능 ? `<button class="lgo" id="psgo" onclick="prodSave()" style="background:var(--bad)">이카운트에 저장</button>`
    : '<p class="lmsg bad">위 오류를 고친 뒤 미리보기를 다시 받아주세요</p>');
}
const prodText = r => [['생산불출', r.불출], ['생산입고', r.입고]].filter(([, t]) => t).map(([h, t]) =>
  `<section><div class="sh"><h2>${h}</h2></div><div class="box" style="padding:12px;white-space:pre-wrap;font-size:13px;line-height:1.5">${esc(t.replace(/\n?→ 이대로 저장하려면.*$/m, ''))}</div></section>`).join('');
async function prodSave() {
  if (!PBODY) return prodDirty();
  const b = JSON.parse(PBODY);
  if (!confirm(`전표일자 ${b.date.replaceAll('-', '.')}\n생산불출 ${b.불출.length}제품 · 생산입고 ${b.입고.length}품목\n이카운트에 저장할까요? (저장 후 일자 수정 불가)`)) return;
  const btn = $('#psgo'), out = $('#pout'), body = PBODY;
  btn.disabled = true; btn.textContent = 'PC로 보내는 중…'; PBODY = '';
  const r = await prodAsk('prod-save', body, () => btn.textContent = 'PC가 받았어요 · 저장하고 재고 확인 중…', 75);
  const done = r.ok && r.확인;
  out.innerHTML = `<div class="lmsg ${done ? 'good' : 'bad'}" style="font-size:16px"><b>${done ? '✓ 완료 — 이카운트 저장과 재고 확인까지 끝났어요' : esc(r.msg || '확인이 필요해요')}</b>
    ${(r.확인내역 || []).length ? `<br><span style="font-size:13px">${r.확인내역.map(esc).join('<br>')}</span>` : ''}</div>` + prodText(r);
}
async function sendLabel(i) {
  const l = LABELS[i], date = $('#ld').value, n = Math.round(+$('#ln').value || 0), btn = $('#lgo'), out = $('#lr');
  const t = ($('#lt')?.value || '').trim() || l.제목;
  if (!date) return out.innerHTML = '<p class="lmsg bad">제조일을 골라주세요</p>';
  if (n < 1 || n > 500) return out.innerHTML = '<p class="lmsg bad">장수는 1~500장</p>';
  if (!PWD) return out.innerHTML = '<p class="lmsg bad">비밀번호를 다시 넣어야 해요. 현황판을 새로고침해 주세요</p>';
  if (!confirm(`${t || l.이름}${t !== l.제목 ? `\n(제목 바꿈 · 원래: ${l.제목})` : ''}\n제조일 ${date.replaceAll('-', '.')} · ${n}장\n1층라벨프린터로 출력할까요?`)) return;
  btn.disabled = true; btn.textContent = 'PC로 보내는 중…'; out.innerHTML = '';
  const fin = await labelAsk('print', i, n, () => btn.textContent = 'PC가 받았어요 · 인쇄 중…');
  btn.disabled = false; btn.textContent = '출력';
  out.innerHTML = fin.ok ? `<p class="lmsg good">✓ 프린터로 보냈어요 · 제조일 ${esc(fin.제조일)}${fin.소비기한 ? ` · 소비기한 ${esc(fin.소비기한)}` : ''} · ${fin.n}장</p>` : `<p class="lmsg bad">${esc(fin.msg)}</p>`;
  if (fin.최근) showRecent(i, fin.최근);
}

// 인터넷용(window.ENC 있음): 비밀번호로 풀기. PBKDF2 → AES-GCM, 모바일올리기.js 와 같은 방식
async function unlock(pw) {
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)), E = window.ENC;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(E.salt), iterations:E.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const d = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b(E.iv)}, key, b(E.ct))));
  Object.assign(window, d);
  PWD = pw;   // 라벨 출력 요청 서명용 (PC 라벨서버.py 가 같은 비밀번호로 확인)
}
function lockScreen(msg) {
  document.querySelector('nav').style.display = 'none';
  $('#ttl').textContent = '청주공장 현황판';
  $('#view').innerHTML = `<form id="lock"><div class="lk">${ic('lock')}</div><h2>직원 전용 현황판</h2><p class="${msg ? 'err' : ''}">${msg || '비밀번호를 넣어주세요'}</p>
    <input type="password" id="pw" autocomplete="current-password" ${window.ENC.num ? 'inputmode="numeric" pattern="[0-9]*"' : ''} aria-label="비밀번호" required><label><input type="checkbox" id="keep" checked> 이 폰에서 기억하기</label><button>열기</button></form>`;
  $('#lock').onsubmit = async e => {
    e.preventDefault();
    try { await unlock($('#pw').value); } catch { return lockScreen('비밀번호가 틀렸어요'); }
    try { $('#keep').checked ? localStorage.setItem('dk_pw', $('#pw').value) : localStorage.removeItem('dk_pw'); } catch {}
    init();
  };
}
// 접속기록: IP·대략 지역(get.geojs.io) → PC 공개키로 암호화 → 중계 → PC 접속기록.txt (사장 PC에서만 풀림)
// ponytail: 지역은 IP 기준이라 통신사 폰은 서울로 찍히기도 함. 기록 실패해도 화면엔 영향 없음
let ACCGEO;
async function accLog(e) {
  if (!window.ACC) return;
  try {
    ACCGEO ??= fetch('https://get.geojs.io/v1/ip/geo.json', { signal: AbortSignal.timeout(6000) }).then(r => r.json()).catch(() => ({}));
    const g = await ACCGEO, cut = (s, n) => String(s || '').slice(0, n);
    const ua = navigator.userAgentData, hi = await ua?.getHighEntropyValues?.(['model']).catch(() => null);
    const d = cut(hi?.model || (/iPhone|iPad|Android|Windows|Mac/.exec(navigator.userAgent) || ['?'])[0], 20);
    const msg = JSON.stringify({ e, i: cut(g.ip, 39), c: cut(g.city, 18), r: cut(g.region, 20), n: cut(g.country_code, 2), o: cut(g.organization_name, 24), d });
    const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const k = await crypto.subtle.importKey('spki', b(ACC.k), { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, k, new TextEncoder().encode(msg)));
    await fetch('https://ntfy.sh/' + ACC.t, { method: 'POST', body: btoa(String.fromCharCode(...ct)), keepalive: true });
  } catch {}
}
if (window.ENC) {   // 열기 1번 + 비밀번호 결과
  accLog('o');
  const u = unlock;
  unlock = pw => u(pw).then(r => (accLog('ok'), r), err => (accLog('bad'), Promise.reject(err)));
}
if (!window.ENC) init();
else {
  let saved = null; try { saved = localStorage.getItem('dk_pw'); } catch {}
  saved ? unlock(saved).then(init, () => lockScreen('비밀번호가 바뀌었어요. 새 비밀번호를 넣어주세요')) : lockScreen();
}
</script>
