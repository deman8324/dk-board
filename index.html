#back{background:none;border:0;color:#fff;font-size:22px;padding:0 6px 0 0;display:none}
main{padding:12px 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.card h2 a{font-size:13px;color:var(--sub);text-decoration:none;font-weight:400}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:inherit;min-height:92px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-size:16px}.tile span{font-size:13px;color:var(--sub)}
.tile i{font-style:normal;font-size:24px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.muted{color:var(--sub);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--soft);margin-right:4px}
.tag.today{background:var(--acc);color:#000}.tag.bad{background:var(--bad);color:#fff}
.bad{color:var(--bad);font-weight:700}.ok{color:var(--ok)}
input[type=search],input[type=number]{width:100%;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.list a{display:flex;justify-content:space-between;padding:13px 2px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.list a:first-child{border-top:0}
.batch{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.batch button{width:46px;height:46px;font-size:22px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.batch input{text-align:center;font-size:22px;font-weight:700}
.batch b{white-space:nowrap}
details{border-top:1px solid var(--line)}details:first-of-type{border-top:0}
summary{padding:12px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:8px 0 10px;font-size:11px;color:var(--sub);text-decoration:none}
nav a i{display:block;font-style:normal;font-size:20px}
nav a.on{color:var(--ink);font-weight:700}
#lock{max-width:360px;margin:18vh auto 0;padding:0 16px;text-align:center}
#lock button{width:100%;margin-top:10px;font-size:17px;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff}
</style>
</head>
<body>
<header><button id="back" onclick="history.back()" aria-label="뒤로">‹</button><h1 id="ttl">청주공장 현황판</h1><small id="upd"></small></header>
<main id="view"></main>
<nav>
  <a href="#home"><i>🏠</i>홈</a>
  <a href="#plan"><i>📅</i>생산</a>
  <a href="#recipe"><i>🧪</i>배합표</a>
  <a href="#stock"><i>📦</i>재고</a>
  <a href="#orders"><i>🚚</i>발주</a>
</nav>
<script>
let P, O, C, W, stock, plan, openOrders;
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd = d => new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const TODAY = ymd(new Date()), TMR = ymd(new Date(Date.now()+864e5));
const md = s => `${+s.slice(5,7)}/${+s.slice(8,10)}(${'일월화수목금토'[new Date(s).getDay()]})`;
const n = (x, d=1) => (+x).toLocaleString('ko-KR', {maximumFractionDigits:d});
const dayTag = s => s === TODAY ? '<span class="tag today">오늘</span>' : s === TMR ? '<span class="tag">내일</span>' : s < TODAY ? '<span class="tag bad">지남</span>' : '';

function init() {
  P = window.PROD || {레시피:{},생산계획:[]}; O = (window.ORDERS||{orders:[]}).orders;
  C = window.BOARD || {events:[], notice:[]}; W = (window.ECOUNT_WAREHOUSE||{warehouses:[]}).warehouses;
  // 이카운트 재고: 이름 → 수량 (원재료창고·제품창고)
  stock = {};
  for (const w of W) for (const g of w.groups) for (const it of g.items) stock[it.name] = (stock[it.name] || 0) + it.qty;
  plan = (P.생산계획 || []).filter(p => p.날짜 >= TODAY).sort((a,b) => a.날짜.localeCompare(b.날짜));
  openOrders = O.filter(o => o.납기 && o.납기 >= TODAY).sort((a,b) => a.납기.localeCompare(b.납기));
  $('#upd').textContent = (P.updated || '').slice(5) + ' 기준';
  document.querySelector('nav').style.display = '';
  addEventListener('hashchange', route); route();
}

// 인터넷용(window.ENC 있음): 비밀번호로 풀기. PBKDF2 → AES-GCM, 모바일올리기.js 와 같은 방식
async function unlock(pw) {
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)), E = window.ENC;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(E.salt), iterations:E.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const d = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b(E.iv)}, key, b(E.ct))));
  Object.assign(window, d);
}
function lockScreen(msg) {
  document.querySelector('nav').style.display = 'none';
  $('#view').innerHTML = `<form id="lock"><h2>🔒 청주공장 현황판</h2><p class="muted">${msg || '비밀번호를 넣어주세요'}</p>
    <input type="password" id="pw" autocomplete="current-password" required><label class="muted" style="display:block;margin-top:8px"><input type="checkbox" id="keep" checked> 이 폰에서 기억하기</label><button>열기</button></form>`;
  $('#lock').onsubmit = async e => {
    e.preventDefault();
    try { await unlock($('#pw').value); } catch { return lockScreen('비밀번호가 틀렸어요'); }
    try { $('#keep').checked ? localStorage.setItem('dk_pw', $('#pw').value) : localStorage.removeItem('dk_pw'); } catch {}
    init();
  };
}
const planRow = p => `<div class="row"><div>${dayTag(p.날짜)}${esc(p.제품 || p.원문)}</div><div class="r">${p.배합 ? n(p.배합)+' 배합' : esc(p.원문.replace(p.제품||'','')) }</div></div>`;
const orderRow = o => `<div class="row"><div>${dayTag(o.납기)}<b>${esc(o.거래처.split('→').pop().trim())}</b><div class="muted">${o.품목.map(i => esc(i.이름)+' '+n(i.수량,0)+esc(i.단위)).join(', ')}</div></div><div class="r">${md(o.납기)}<div class="muted">${esc(o.구분)}</div></div></div>`;

const pages = {
  home() {
    const t = plan.filter(p => p.날짜 === TODAY), m = plan.filter(p => p.날짜 === TMR);
    return `
    <div class="tiles">
      <a class="tile" href="#plan"><i>📅</i><div><b>생산 일정</b><br><span>오늘 ${t.length}건 · 내일 ${m.length}건</span></div></a>
      <a class="tile" href="#recipe"><i>🧪</i><div><b>배합표</b><br><span>${Object.keys(P.레시피).length}개 제품</span></div></a>
      <a class="tile" href="#stock"><i>📦</i><div><b>재고</b><br><span>이카운트 ${esc(window.ECOUNT_WAREHOUSE?.updated?.slice(5) || '-')}</span></div></a>
      <a class="tile" href="#orders"><i>🚚</i><div><b>발주·출고</b><br><span>납기 남은 ${openOrders.length}건</span></div></a>
    </div>
    <div class="card"><h2>오늘 생산 <a href="#plan">전체 ›</a></h2>${t.map(planRow).join('') || '<div class="muted">없음</div>'}</div>
    <div class="card"><h2>내일 생산</h2>${m.map(planRow).join('') || '<div class="muted">없음</div>'}</div>
    <div class="card"><h2>가까운 납기 <a href="#orders">전체 ›</a></h2>${openOrders.slice(0,4).map(orderRow).join('') || '<div class="muted">없음</div>'}</div>
    ${C.notice.length ? `<div class="card"><h2>📢 공지</h2>${C.notice.map(t => `<div class="row"><div>${esc(t)}</div></div>`).join('')}</div>` : ''}
    <div class="card"><h2>공장 일정 <span class="muted">TV 현황판 ${esc(C.updated || '')}</span></h2>${C.events.filter(e => e.날짜 >= TODAY).slice(0,8).map(e => `<div class="row"><div>${dayTag(e.날짜)}${e.종류 === '알림' ? '🔔 ' : ''}${esc(e.제목)}</div><div class="r muted">${md(e.날짜)}</div></div>`).join('') || '<div class="muted">없음</div>'}</div>`;
  },
  plan() {
    const by = {};
    for (const p of plan) (by[p.날짜] ??= []).push(p);
    return Object.entries(by).map(([d, ps]) => `<div class="card"><h2>${md(d)} ${dayTag(d)}</h2>${ps.map(planRow).join('')}</div>`).join('') || '<div class="card muted">예정된 생산이 없습니다</div>';
  },
  recipe(arg) {
    if (arg) return recipeDetail(decodeURIComponent(arg));
    const kinds = [...new Set(Object.values(P.레시피).map(r => r.구분))];
    return `<input type="search" id="q" placeholder="제품 이름 검색 (예: 찰순대)" oninput="filterRecipes()">
      <div class="chips">${['전체', ...kinds].map((k,i) => `<button class="chip${i?'':' on'}" onclick="pickKind(this)">${esc(k)}</button>`).join('')}</div>
      <div class="card list" id="rl"></div>`;
  },
  stock() {
    return `<input type="search" id="sq" placeholder="품목 검색" oninput="filterStock()">
      <div class="muted" style="margin:8px 2px">이카운트 기준 ${esc(window.ECOUNT_WAREHOUSE?.updated || '')}</div>
      ${W.map(w => `<div class="card"><h2>${esc(w.name)}</h2>${w.groups.map(g => `<details><summary>${esc(g.name)}<span class="muted">${g.items.length}</span></summary>
        ${g.items.map(i => `<div class="row si" data-n="${esc(i.name)}"><div>${esc(i.name)}</div><div class="r ${i.qty <= 0 ? 'bad' : ''}">${n(i.qty)}</div></div>`).join('')}</details>`).join('')}</div>`).join('')}`;
  },
  orders() {
    return `<div class="card"><h2>납기 남은 발주 <span class="muted">${openOrders.length}건</span></h2>${openOrders.map(orderRow).join('') || '<div class="muted">없음</div>'}</div>`;
  }
};

let kind = '전체';
function pickKind(b) { document.querySelectorAll('.chip').forEach(c => c.classList.remove('on')); b.classList.add('on'); kind = b.textContent; filterRecipes(); }
function filterRecipes() {
  const q = ($('#q')?.value || '').replace(/\s/g, '');
  $('#rl').innerHTML = Object.entries(P.레시피)
    .filter(([k, r]) => (kind === '전체' || r.구분 === kind) && k.replace(/\s/g, '').includes(q))
    .map(([k, r]) => `<a href="#recipe/${encodeURIComponent(k)}"><span>${esc(k)}</span><span class="muted">${r.생산kg ? n(r.생산kg)+'kg ›' : '›'}</span></a>`).join('') || '<div class="muted">검색 결과 없음</div>';
}
function filterStock() {
  const q = $('#sq').value.replace(/\s/g, '');
  document.querySelectorAll('.si').forEach(r => r.style.display = r.dataset.n.replace(/\s/g, '').includes(q) ? '' : 'none');
  document.querySelectorAll('details').forEach(d => d.open = !!q);
}

function recipeDetail(name) {
  const r = P.레시피[name];
  if (!r) return '<div class="card">배합표를 찾을 수 없습니다</div>';
  return `<div class="card"><h2>${esc(name)} <span class="muted">${esc(r.구분)}</span></h2>
    <div class="muted">1배합 ${r.생산kg ? n(r.생산kg)+'kg' : ''} · 배합표 ${esc(P.출처?.[r.구분 === '순대' ? '순대배합표' : '소스배합표'] || '')}</div>
    <div class="batch"><button onclick="bump(-1)">−</button><input type="number" id="bn" value="1" min="0.5" step="0.5" inputmode="decimal" oninput="calc()"><button onclick="bump(1)">+</button><b>배합</b></div>
    <div id="rt"></div></div>`;
}
function bump(d) { const i = $('#bn'); i.value = Math.max(0.5, (+i.value || 0) + d); calc(); }
function calc() {
  const name = decodeURIComponent(location.hash.split('/')[1]), r = P.레시피[name], b = +$('#bn').value || 0;
  const head = `<div class="row muted"><div>원재료</div><div class="r">필요량 / 이카운트 재고</div></div>`;
  $('#rt').innerHTML = head + Object.entries(r.원재료).map(([m, kg]) => {
    const need = kg * b, ek = r.이카운트?.[m], have = ek != null ? stock[ek] : undefined;
    const short = have !== undefined && have < need;
    return `<div class="row"><div>${esc(m)}</div><div class="r"><b>${n(need, 2)}</b> kg<div class="muted ${short ? 'bad' : ''}">${have === undefined ? '재고 연결 없음' : '재고 ' + n(have) + (short ? ' 부족' : '')}</div></div></div>`;
  }).join('') + `<div class="row"><b>합계</b><div class="r"><b>${n(Object.values(r.원재료).reduce((a, x) => a + x, 0) * b, 2)} kg</b></div></div>`;
}

const TITLES = {home:'청주공장 현황판', plan:'생산 일정', recipe:'배합표', stock:'재고 (이카운트)', orders:'발주·출고'};
function route() {
  const [p, arg] = (location.hash.slice(1) || 'home').split('/');
  const page = pages[p] ? p : 'home';
  $('#view').innerHTML = pages[page](arg);
  $('#ttl').textContent = arg ? decodeURIComponent(arg) : TITLES[page];
  $('#back').style.display = arg ? 'block' : 'none';
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.hash === '#' + page));
  if (page === 'recipe') arg ? calc() : filterRecipes();
  scrollTo(0, 0);
}
if (!window.ENC) init();
else {
  let saved = null; try { saved = localStorage.getItem('dk_pw'); } catch {}
  saved ? unlock(saved).then(init, () => lockScreen('비밀번호가 바뀌었어요. 새 비밀번호를 넣어주세요')) : lockScreen();
}
</script>
</body>
</html>
